name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Shipped (production) dependencies block on high findings. Dev tooling is
      # reported but non-blocking: Tailwind 3's `braces` chain has no patched
      # release, and clearing it needs the Tailwind 4 migration.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit (dev tooling, report only)
        run: npm audit --audit-level=high || echo "::warning::Dev dependency audit has high findings; see the log above."

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
