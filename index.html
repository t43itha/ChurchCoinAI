<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>ChurchCoin - Swiss Ledger</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['DM Sans', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              // Swiss Ledger Design System
              ink: '#000000',
              paper: '#fafaf9',
              charcoal: '#1a1a1a',
              ledger: '#e5e5e5',
              grey: {
                dark: '#44403c',
                mid: '#666666',
                light: '#f5f5f5',
              },
              sage: {
                DEFAULT: '#6b8e6b',
                light: '#e8f0e8',
                dark: '#557555',
              },
              amber: {
                DEFAULT: '#d4a574',
                light: '#faefe6',
                dark: '#b5895b',
              },
              error: {
                DEFAULT: '#c64545',
                light: '#fce8e8',
              },
              // Keep slate for compatibility during migration
              slate: {
                50: '#fafaf9',
                100: '#f5f5f4',
                200: '#e5e5e5',
                300: '#d4d4d4',
                400: '#a3a3a3',
                500: '#666666',
                600: '#525252',
                700: '#44403c',
                800: '#1a1a1a',
                900: '#000000',
              },
            },
            boxShadow: {
              'hard-sm': '2px 2px 0px 0px rgba(0, 0, 0, 1)',
              'hard-md': '4px 4px 0px 0px rgba(0, 0, 0, 1)',
              'hard-lg': '8px 8px 0px 0px rgba(0, 0, 0, 1)',
              'hard-amber': '4px 4px 0px 0px #d4a574',
            },
          }
        }
      }
    </script>
    <style>
      /* Swiss Ledger Design System - Base Styles */
      body {
        font-family: 'DM Sans', system-ui, sans-serif;
        background-color: #fafaf9;
        color: #000000;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior-y: none;
      }

      /* Swiss Card - Hard Shadow System */
      .swiss-card {
        background: white;
        border: 1px solid #000000;
        border-radius: 8px;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .swiss-card:hover {
        transform: translate(-2px, -2px);
        box-shadow: 4px 4px 0px rgba(0, 0, 0, 1);
      }

      /* Non-interactive card variant */
      .swiss-card-static {
        background: white;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
      }

      /* Ledger Table - 2px Border System */
      .ledger-table {
        border: 2px solid #000000;
        border-radius: 4px;
        background: white;
      }
      .ledger-table th {
        font-family: 'DM Sans', system-ui, sans-serif;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-size: 0.65rem;
        font-weight: 700;
        color: #000000;
        background-color: #fafaf9;
        border-bottom: 2px solid #000000;
        padding: 16px;
        white-space: nowrap;
      }
      .ledger-table td {
        border-bottom: 1px solid #e5e5e5;
        padding: 16px;
        white-space: nowrap;
      }
      .ledger-table tr:nth-child(even) {
        background-color: #fafaf9;
      }
      .ledger-table tr:hover {
        background-color: #faefe6;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e5e5e5;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d4d4d4;
      }

      /* Animations */
      @keyframes enter {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-enter {
        animation: enter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Button Primary - Hard Shadow Hover */
      .btn-primary {
        background-color: #000000;
        color: white;
        border: 1px solid #000000;
        border-radius: 8px;
        transition: all 0.2s;
      }
      .btn-primary:hover {
        transform: translate(-2px, -2px);
        box-shadow: 4px 4px 0px 0px #d4a574;
      }
      .btn-primary:active {
        transform: translate(0, 0);
        box-shadow: none;
      }

      /* Button Secondary */
      .btn-secondary {
        background-color: #e8f0e8;
        color: #557555;
        border: 1px solid #6b8e6b;
        border-radius: 8px;
        transition: all 0.2s;
      }
      .btn-secondary:hover {
        transform: translate(-2px, -2px);
        box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
      }

      /* Button Outline */
      .btn-outline {
        background-color: white;
        color: #000000;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        transition: all 0.2s;
      }
      .btn-outline:hover {
        border-color: #000000;
        transform: translate(-2px, -2px);
        box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
      }

      /* Highlight Pop - Amber Accent */
      .highlight-pop {
        position: relative;
      }
      .highlight-pop::after {
        content: '';
        position: absolute;
        bottom: 1px;
        left: 0;
        right: 0;
        height: 4px;
        background-color: #d4a574;
        opacity: 0.4;
        z-index: -1;
      }

      /* Badge Styles */
      .badge-success {
        background-color: #e8f0e8;
        color: #557555;
        border: 1px solid #6b8e6b;
      }
      .badge-warning {
        background-color: #faefe6;
        color: #b5895b;
        border: 1px solid #d4a574;
      }
      .badge-error {
        background-color: #fce8e8;
        color: #c64545;
        border: 1px solid #c64545;
      }

      /* Amount Display */
      .amount-positive { color: #6b8e6b; }
      .amount-negative { color: #c64545; }
      .amount-zero { color: #666666; }

      /* Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        .swiss-card,
        .btn-primary,
        .btn-secondary,
        .btn-outline {
          transition: none;
        }
        .animate-enter {
          animation: none;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",

  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
