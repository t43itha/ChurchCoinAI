<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDFCF8" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>ChurchCoin - Swiss Ledger</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['DM Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              // Mapping 'slate' to 'stone' for global warmth
              slate: {
                50: '#fafaf9',
                100: '#f5f5f4',
                200: '#e7e5e4',
                300: '#d6d3d1',
                400: '#a8a29e',
                500: '#78716c',
                600: '#57534e',
                700: '#44403c',
                800: '#292524', // Warm Charcoal
                900: '#1c1917',
              },
              // Custom Paper/Cream tones
              paper: '#FDFCF8',
              // Warmer accents
              primary: '#292524',
              accent: '#ea580c', // Burnt Orange
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FDFCF8; /* Warm Paper Background */
        color: #292524;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile */
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: 'DM Sans', sans-serif;
      }
      
      /* Swiss Grid Utilities - Warm Edition */
      .swiss-card {
        background: white;
        border: 1px solid #e7e5e4; /* Stone-200 */
        border-radius: 8px;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 1px 2px rgba(41, 37, 36, 0.02);
      }
      .swiss-card:hover {
        border-color: #d6d3d1; /* Stone-300 */
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(41, 37, 36, 0.04);
      }
      
      .ledger-table th {
        font-family: 'DM Sans', sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.65rem;
        font-weight: 700;
        color: #78716c; /* Stone-500 */
        white-space: nowrap;
      }
      
      .ledger-table td {
        border-bottom: 1px solid #f5f5f4; /* Stone-100 */
        padding-top: 1rem;
        padding-bottom: 1rem;
        white-space: nowrap;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d6d3d1;
        border-radius: 3px;
      }
      
      /* Animations */
      @keyframes enter {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-enter {
        animation: enter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      /* Micro-interactions */
      .btn-primary {
        background-color: #292524; /* Stone-800 */
        color: white;
        transition: all 0.2s;
        border-radius: 6px;
      }
      .btn-primary:hover {
        background-color: #1c1917; /* Stone-900 */
        transform: translateY(-1px);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      .btn-primary:active {
        transform: scale(0.98);
      }

      /* Highlight Pop */
      .highlight-pop {
        position: relative;
      }
      .highlight-pop::after {
        content: '';
        position: absolute;
        bottom: 1px;
        left: 0;
        right: 0;
        height: 4px;
        background-color: #fdba74; /* Orange-300 */
        opacity: 0.3;
        z-index: -1;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
