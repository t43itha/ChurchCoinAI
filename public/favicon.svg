<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Circle border matching the logo -->
  <circle cx="16" cy="16" r="14" fill="white" stroke="#000000" stroke-width="2"/>

  <!-- Calculator icon -->
  <g stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Calculator body -->
    <rect x="10" y="8" width="12" height="16" rx="1.5"/>
    <!-- Display screen -->
    <rect x="12" y="10" width="8" height="3" rx="0.5"/>
    <!-- Calculator buttons grid -->
    <rect x="12" y="15" width="2" height="2" rx="0.3" fill="#000000" stroke="none"/>
    <rect x="15" y="15" width="2" height="2" rx="0.3" fill="#000000" stroke="none"/>
    <rect x="18" y="15" width="2" height="2" rx="0.3" fill="#000000" stroke="none"/>
    <rect x="12" y="18" width="2" height="2" rx="0.3" fill="#000000" stroke="none"/>
    <rect x="15" y="18" width="2" height="2" rx="0.3" fill="#000000" stroke="none"/>
    <rect x="18" y="18" width="2" height="2" rx="0.3" fill="#000000" stroke="none"/>
    <rect x="12" y="21" width="2" height="2" rx="0.3" fill="#000000" stroke="none"/>
    <rect x="15" y="21" width="5" height="2" rx="0.3" fill="#000000" stroke="none"/>
  </g>
</svg>
