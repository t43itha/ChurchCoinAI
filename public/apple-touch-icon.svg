<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Solid black background for iOS home screen -->
  <rect width="180" height="180" fill="#000000"/>

  <!-- White calculator icon centered -->
  <g transform="translate(45, 30)" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Calculator body -->
    <rect x="10" y="10" width="70" height="100" rx="8"/>
    <!-- Display screen -->
    <rect x="18" y="18" width="54" height="24" rx="4" fill="#ffffff" stroke="none"/>
    <!-- Calculator buttons -->
    <circle cx="32" cy="58" r="6" fill="#ffffff" stroke="none"/>
    <circle cx="45" cy="58" r="6" fill="#ffffff" stroke="none"/>
    <circle cx="58" cy="58" r="6" fill="#ffffff" stroke="none"/>
    <circle cx="32" cy="78" r="6" fill="#ffffff" stroke="none"/>
    <circle cx="45" cy="78" r="6" fill="#ffffff" stroke="none"/>
    <circle cx="58" cy="78" r="6" fill="#ffffff" stroke="none"/>
    <circle cx="32" cy="98" r="6" fill="#ffffff" stroke="none"/>
    <circle cx="45" cy="98" r="6" fill="#ffffff" stroke="none"/>
    <circle cx="58" cy="98" r="6" fill="#ffffff" stroke="none"/>
  </g>
</svg>
