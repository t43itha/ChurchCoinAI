<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Solid background for iOS home screen -->
  <rect width="180" height="180" fill="#fafaf9"/>

  <!-- Circle with calculator matching the logo -->
  <circle cx="90" cy="90" r="70" fill="white" stroke="#000000" stroke-width="4"/>

  <!-- Calculator icon -->
  <g stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Calculator body -->
    <rect x="60" y="45" width="60" height="80" rx="6"/>
    <!-- Display screen -->
    <rect x="68" y="53" width="44" height="16" rx="2" fill="none"/>
    <!-- Calculator buttons grid -->
    <rect x="68" y="76" width="10" height="10" rx="1.5" fill="#000000" stroke="none"/>
    <rect x="85" y="76" width="10" height="10" rx="1.5" fill="#000000" stroke="none"/>
    <rect x="102" y="76" width="10" height="10" rx="1.5" fill="#000000" stroke="none"/>
    <rect x="68" y="92" width="10" height="10" rx="1.5" fill="#000000" stroke="none"/>
    <rect x="85" y="92" width="10" height="10" rx="1.5" fill="#000000" stroke="none"/>
    <rect x="102" y="92" width="10" height="10" rx="1.5" fill="#000000" stroke="none"/>
    <rect x="68" y="108" width="10" height="10" rx="1.5" fill="#000000" stroke="none"/>
    <rect x="85" y="108" width="27" height="10" rx="1.5" fill="#000000" stroke="none"/>
  </g>
</svg>
